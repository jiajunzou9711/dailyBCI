<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="560" fill="#fbfaf7"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fbb"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>

  <text x="250" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">方案 A：判断在采集设备上</text>
  <text x="750" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">方案 B：判断在电脑上</text>
  <line x1="500" y1="20" x2="500" y2="470" stroke="#ddd" stroke-width="2"/>

  <!-- ===== A ===== -->
  <g font-size="16" fill="#222">
    <rect x="30" y="220" width="90" height="60" rx="8" fill="#eee" stroke="#999"/><text x="75" y="256" text-anchor="middle">小鼠</text>
    <rect x="170" y="120" width="150" height="70" rx="8" fill="#fff" stroke="#333"/><text x="245" y="150" text-anchor="middle">采集设备</text><text x="245" y="174" text-anchor="middle" font-size="14" fill="#c0392b">（含判断）</text>
    <rect x="170" y="330" width="150" height="60" rx="8" fill="#fff" stroke="#333"/><text x="245" y="366" text-anchor="middle">光源驱动与光源</text>
    <rect x="370" y="120" width="110" height="60" rx="8" fill="#fff" stroke="#333"/><text x="425" y="156" text-anchor="middle">电脑</text>
    <rect x="370" y="330" width="110" height="60" rx="8" fill="#fff" stroke="#333"/><text x="425" y="366" text-anchor="middle">摄像头</text>
  </g>
  <line x1="110" y1="220" x2="170" y2="165" stroke="#999" stroke-width="2" marker-end="url(#p)"/>
  <line x1="170" y1="360" x2="112" y2="282" stroke="#999" stroke-width="2" marker-end="url(#p)"/>
  <line x1="245" y1="190" x2="245" y2="328" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
  <text x="252" y="265" font-size="14" fill="#c0392b">给光指令</text>
  <line x1="320" y1="150" x2="368" y2="150" stroke="#2c6fbb" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#s)"/>
  <text x="344" y="110" text-anchor="middle" font-size="13" fill="#2c6fbb">神经数据</text>
  <text x="344" y="96" text-anchor="middle" font-size="13" fill="#2c6fbb">判断结果</text>
  <line x1="425" y1="330" x2="425" y2="182" stroke="#2c6fbb" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#s)"/>
  <text x="432" y="265" font-size="14" fill="#2c6fbb">行为视频</text>

  <!-- ===== B ===== -->
  <g font-size="16" fill="#222">
    <rect x="530" y="220" width="90" height="60" rx="8" fill="#eee" stroke="#999"/><text x="575" y="256" text-anchor="middle">小鼠</text>
    <rect x="670" y="120" width="150" height="70" rx="8" fill="#fff" stroke="#333"/><text x="745" y="161" text-anchor="middle">采集设备</text>
    <rect x="670" y="330" width="150" height="60" rx="8" fill="#fff" stroke="#333"/><text x="745" y="366" text-anchor="middle">光源驱动与光源</text>
    <rect x="870" y="120" width="110" height="70" rx="8" fill="#fff" stroke="#333"/><text x="925" y="150" text-anchor="middle">电脑</text><text x="925" y="174" text-anchor="middle" font-size="14" fill="#c0392b">（含判断）</text>
    <rect x="870" y="330" width="110" height="60" rx="8" fill="#fff" stroke="#333"/><text x="925" y="366" text-anchor="middle">摄像头</text>
  </g>
  <line x1="610" y1="220" x2="670" y2="165" stroke="#999" stroke-width="2" marker-end="url(#p)"/>
  <line x1="670" y1="360" x2="612" y2="282" stroke="#999" stroke-width="2" marker-end="url(#p)"/>
  <line x1="820" y1="150" x2="868" y2="150" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
  <text x="844" y="110" text-anchor="middle" font-size="13" fill="#c0392b">神经数据</text>
  <text x="844" y="96" text-anchor="middle" font-size="12" fill="#555">控制＋保存</text>
  <line x1="880" y1="190" x2="800" y2="328" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
  <text x="770" y="265" text-anchor="end" font-size="14" fill="#c0392b">给光指令</text>
  <line x1="955" y1="330" x2="955" y2="192" stroke="#2c6fbb" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#s)"/>
  <text x="962" y="265" font-size="14" fill="#2c6fbb">视频</text>

  <!-- legend -->
  <g font-size="15" fill="#333">
    <line x1="60" y1="505" x2="110" y2="505" stroke="#c0392b" stroke-width="3"/><text x="120" y="510">控制：要求及时送达</text>
    <line x1="300" y1="505" x2="350" y2="505" stroke="#2c6fbb" stroke-width="3" stroke-dasharray="7,5"/><text x="360" y="510">保存：要求事后能对齐</text>
    <line x1="560" y1="505" x2="610" y2="505" stroke="#999" stroke-width="2"/><text x="620" y="510">物理通路（电极、光纤）</text>
    <text x="500" y="542" text-anchor="middle" font-size="14" fill="#777">箭头表示信息方向，不代表线缆</text>
  </g>
</svg>
