<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="-apple-system,'Helvetica Neue','Heiti SC','PingFang SC',sans-serif"><rect width="900" height="545" fill="#FAFAFA"/><text x="0" y="64" font-size="28" fill="#1A1A1A" text-anchor="start" font-weight="700">本期路线</text><text x="4" y="166" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">①</text><text x="54" y="166" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">三件事，两条线</text><text x="54" y="200" font-size="21" fill="#888888" text-anchor="start" font-weight="400">刷屏的 DOOM、3 月的虚拟果蝇、2024 年的论文，分别是什么</text><text x="4" y="242" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">②</text><text x="54" y="242" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">复制了连接之后，还补了什么</text><text x="54" y="276" font-size="21" fill="#888888" text-anchor="start" font-weight="400">连接组是静态的；让它跑起来的规则由建模选定</text><text x="4" y="318" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">③</text><text x="54" y="318" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">预测怎么做，又怎么被检验</text><text x="54" y="352" font-size="21" fill="#888888" text-anchor="start" font-weight="400">106 个细胞类型，模型算一遍，真果蝇做一遍</text><text x="4" y="394" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">④</text><text x="54" y="394" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">完整动作从哪里来</text><text x="54" y="428" font-size="21" fill="#888888" text-anchor="start" font-weight="400">脑模型、人工接口、身体控制器各承担什么</text><text x="4" y="470" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">⑤</text><text x="54" y="470" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">能主张什么，不能主张什么</text><text x="54" y="504" font-size="21" fill="#888888" text-anchor="start" font-weight="400">这一期的落点</text></svg>