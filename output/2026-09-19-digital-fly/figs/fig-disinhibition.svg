<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="-apple-system,'Helvetica Neue','Heiti SC','PingFang SC',sans-serif"><rect width="900" height="580" fill="#FAFAFA"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A1A1A"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A2B2B"/></marker></defs><text x="0" y="30" font-size="25" fill="#1A1A1A" text-anchor="start" font-weight="700">激活 Phantom 之后，下游会怎样</text><text x="0" y="58" font-size="18" fill="#888888" text-anchor="start" font-weight="400">横线末端的短竖杠表示抑制性连接</text><text x="0" y="96" font-size="23" fill="#1A1A1A" text-anchor="start" font-weight="700">模型里（基础放电设为 0 Hz）</text><circle cx="96" cy="170" r="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="96" y="177" font-size="19" fill="#1A1A1A" text-anchor="middle" font-weight="700">Phantom</text><text x="96" y="248" font-size="19" fill="#888888" text-anchor="middle" font-weight="400">驱动到 50 Hz</text><line x1="148" y1="170" x2="314" y2="170" stroke="#1A1A1A" stroke-width="2.4"/><line x1="314" y1="152" x2="314" y2="188" stroke="#1A1A1A" stroke-width="3"/><circle cx="386" cy="170" r="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="386" y="177" font-size="19" fill="#1A1A1A" text-anchor="middle" font-weight="700">Scapula</text><text x="386" y="248" font-size="19" fill="#888888" text-anchor="middle" font-weight="400">0 Hz → 仍为 0 Hz</text><line x1="438" y1="170" x2="604" y2="170" stroke="#1A1A1A" stroke-width="2.4"/><line x1="604" y1="152" x2="604" y2="188" stroke="#1A1A1A" stroke-width="3"/><circle cx="676" cy="170" r="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="676" y="177" font-size="19" fill="#1A1A1A" text-anchor="middle" font-weight="700">Roundup</text><text x="676" y="248" font-size="19" fill="#888888" text-anchor="middle" font-weight="400">0 Hz</text><line x1="728" y1="170" x2="798" y2="170" stroke="#1A1A1A" stroke-width="2.4" marker-end="url(#ar)"/><text x="808" y="178" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">MN9</text><text x="0" y="292" font-size="20" fill="#8A2B2B" text-anchor="start" font-weight="700">没有可解除的抑制，MN9 不发放，模型判为“不会伸喙”</text><line x1="0" y1="330" x2="880" y2="330" stroke="#D8D8D8" stroke-width="1.5"/><text x="0" y="368" font-size="23" fill="#1A1A1A" text-anchor="start" font-weight="700">真实果蝇里（存在持续自发活动）</text><circle cx="96" cy="442" r="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="96" y="449" font-size="19" fill="#1A1A1A" text-anchor="middle" font-weight="700">Phantom</text><text x="96" y="520" font-size="19" fill="#888888" text-anchor="middle" font-weight="400">被激活</text><line x1="148" y1="442" x2="314" y2="442" stroke="#1A1A1A" stroke-width="2.4"/><line x1="314" y1="424" x2="314" y2="460" stroke="#1A1A1A" stroke-width="3"/><circle cx="386" cy="442" r="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="386" y="449" font-size="19" fill="#1A1A1A" text-anchor="middle" font-weight="700">Scapula</text><text x="386" y="520" font-size="19" fill="#888888" text-anchor="middle" font-weight="400">持续发放 → 被压低</text><line x1="438" y1="442" x2="604" y2="442" stroke="#1A1A1A" stroke-width="2.4"/><line x1="604" y1="424" x2="604" y2="460" stroke="#1A1A1A" stroke-width="3"/><circle cx="676" cy="442" r="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="676" y="449" font-size="19" fill="#1A1A1A" text-anchor="middle" font-weight="700">Roundup</text><text x="676" y="520" font-size="19" fill="#888888" text-anchor="middle" font-weight="400">抑制被解除</text><line x1="728" y1="442" x2="798" y2="442" stroke="#1A1A1A" stroke-width="2.4" marker-end="url(#ar)"/><text x="808" y="450" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">MN9</text><text x="0" y="564" font-size="20" fill="#2F6DB5" text-anchor="start" font-weight="700">喙伸出，实验记为“会伸喙”</text></svg>