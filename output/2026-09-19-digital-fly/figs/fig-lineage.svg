<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="-apple-system,'Helvetica Neue','Heiti SC','PingFang SC',sans-serif"><rect width="900" height="500" fill="#FAFAFA"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A1A1A"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A2B2B"/></marker></defs><text x="0" y="40" font-size="24" fill="#1A1A1A" text-anchor="start" font-weight="700">连续切片透射电镜（ssTEM）</text><text x="0" y="70" font-size="20" fill="#888888" text-anchor="start" font-weight="400">一次覆盖全脑，数据脏，当年算法分割不了</text><rect x="0" y="96" width="252" height="120" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="18" y="132" font-size="21" fill="#2F6DB5" text-anchor="start" font-weight="700">2018</text><text x="18" y="164" font-size="23" fill="#1A1A1A" text-anchor="start" font-weight="700">FAFB 全脑 EM</text><text x="18" y="194" font-size="19" fill="#888888" text-anchor="start" font-weight="400">一只成年雌果蝇</text><line x1="252" y1="156" x2="292" y2="156" stroke="#888888" stroke-width="2" marker-end="url(#ar)"/><rect x="300" y="96" width="252" height="120" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="318" y="132" font-size="21" fill="#2F6DB5" text-anchor="start" font-weight="700">—</text><text x="318" y="164" font-size="23" fill="#1A1A1A" text-anchor="start" font-weight="700">等算法追上</text><text x="318" y="194" font-size="19" fill="#888888" text-anchor="start" font-weight="400">卷积网络解决对齐</text><line x1="552" y1="156" x2="592" y2="156" stroke="#888888" stroke-width="2" marker-end="url(#ar)"/><rect x="600" y="96" width="252" height="120" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="618" y="132" font-size="21" fill="#2F6DB5" text-anchor="start" font-weight="700">2024</text><text x="618" y="164" font-size="23" fill="#1A1A1A" text-anchor="start" font-weight="700">FlyWire 连接组</text><text x="618" y="194" font-size="19" fill="#888888" text-anchor="start" font-weight="400">139,255 神经元</text><line x1="0" y1="260" x2="852" y2="260" stroke="#D8D8D8" stroke-width="1.5"/><text x="0" y="300" font-size="24" fill="#1A1A1A" text-anchor="start" font-weight="700">聚焦离子束扫描电镜（FIB-SEM）</text><text x="0" y="330" font-size="20" fill="#888888" text-anchor="start" font-weight="400">数据干净、机器可直接分割，一次只能处理很小一块</text><rect x="0" y="356" width="252" height="120" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="18" y="392" font-size="21" fill="#8A5A1E" text-anchor="start" font-weight="700">2020</text><text x="18" y="424" font-size="23" fill="#1A1A1A" text-anchor="start" font-weight="700">hemibrain</text><text x="18" y="454" font-size="19" fill="#888888" text-anchor="start" font-weight="400">中央脑一部分，无视叶</text><line x1="252" y1="416" x2="292" y2="416" stroke="#888888" stroke-width="2" marker-end="url(#ar)"/><rect x="300" y="356" width="252" height="120" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="318" y="392" font-size="21" fill="#8A5A1E" text-anchor="start" font-weight="700">2024</text><text x="318" y="424" font-size="23" fill="#1A1A1A" text-anchor="start" font-weight="700">MANC</text><text x="318" y="454" font-size="19" fill="#888888" text-anchor="start" font-weight="400">雄性腹神经索</text><line x1="552" y1="416" x2="592" y2="416" stroke="#888888" stroke-width="2" marker-end="url(#ar)"/><rect x="600" y="356" width="252" height="120" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="618" y="392" font-size="21" fill="#8A5A1E" text-anchor="start" font-weight="700">2026</text><text x="618" y="424" font-size="23" fill="#1A1A1A" text-anchor="start" font-weight="700">MaleCNS v1.0</text><text x="618" y="454" font-size="19" fill="#888888" text-anchor="start" font-weight="400">雄性完整中枢</text></svg>