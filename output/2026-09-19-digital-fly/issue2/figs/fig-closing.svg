<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="1800" height="1000" font-family="-apple-system,'Helvetica Neue','Heiti SC','PingFang SC',sans-serif"><rect width="900" height="500" fill="#FAFAFA"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A1A1A"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6DB5"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A2B2B"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#888888"/></marker></defs><text x="0" y="34" font-size="25" fill="#1A1A1A" text-anchor="start" font-weight="700">模型里每一类量从哪里来</text><rect x="0" y="62" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="22" y="99" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">突触的位置与数量</text><rect x="330" y="74" width="12" height="34" rx="3" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="0"/><text x="358" y="99" font-size="21" fill="#2F6DB5" text-anchor="start" font-weight="700">电镜重建</text><rect x="0" y="128" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="22" y="165" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">递质</text><rect x="330" y="140" width="12" height="34" rx="3" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="0"/><text x="358" y="165" font-size="21" fill="#2F6DB5" text-anchor="start" font-weight="700">由电镜图像预测</text><rect x="0" y="194" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="22" y="231" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">正负号</text><rect x="330" y="206" width="12" height="34" rx="3" fill="#8A2B2B" stroke="#8A2B2B" stroke-width="0"/><text x="358" y="231" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="700">按递质统一规定</text><rect x="0" y="260" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="22" y="297" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">单个突触的强度</text><rect x="330" y="272" width="12" height="34" rx="3" fill="#8A2B2B" stroke="#8A2B2B" stroke-width="0"/><text x="358" y="297" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="700">全脑一个常数，照一条通路拟合</text><rect x="0" y="326" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="22" y="363" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">神经元参数</text><rect x="330" y="338" width="12" height="34" rx="3" fill="#8A2B2B" stroke="#8A2B2B" stroke-width="0"/><text x="358" y="363" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="700">全脑一组，没有自发放电</text><rect x="0" y="392" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="22" y="429" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">状态与经历</text><rect x="330" y="404" width="12" height="34" rx="3" fill="#888888" stroke="#888888" stroke-width="0"/><text x="358" y="429" font-size="21" fill="#888888" text-anchor="start" font-weight="700">未纳入</text><text x="0" y="478" font-size="18" fill="#888888" text-anchor="start" font-weight="400">蓝：测得或由测量预测　红：统一规定　灰：未纳入</text></svg>