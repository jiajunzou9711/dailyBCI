<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="1800" height="940" font-family="-apple-system,'Helvetica Neue','Heiti SC','PingFang SC',sans-serif"><rect width="900" height="470" fill="#FAFAFA"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A1A1A"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6DB5"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A2B2B"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#888888"/></marker></defs><text x="0" y="34" font-size="25" fill="#1A1A1A" text-anchor="start" font-weight="700">模型在连接组之外补的三项设定</text><text x="130" y="82" font-size="20" fill="#888888" text-anchor="start" font-weight="700">模型怎么设</text><text x="540" y="82" font-size="20" fill="#888888" text-anchor="start" font-weight="700">省掉的</text><rect x="0" y="102" width="880" height="108" rx="12" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="24" y="164" font-size="26" fill="#2F6DB5" text-anchor="start" font-weight="700">连接</text><text x="130" y="146" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="400">强度 = 突触数 × 0.275 mV</text><text x="130" y="182" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="400">每个神经元只有一个正负号</text><text x="540" y="146" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="400">突触后受体的差异</text><text x="540" y="182" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="400">电突触</text><rect x="0" y="224" width="880" height="108" rx="12" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="24" y="286" font-size="26" fill="#2F6DB5" text-anchor="start" font-weight="700">神经元</text><text x="130" y="268" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="400">漏积分发放，全脑一组参数</text><text x="130" y="304" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="400">没有输入时不放电</text><text x="540" y="268" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="400">自发放电、树突计算</text><text x="540" y="304" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="400">不发放动作电位的神经元</text><rect x="0" y="346" width="880" height="108" rx="12" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/><text x="24" y="408" font-size="26" fill="#2F6DB5" text-anchor="start" font-weight="700">时间</text><text x="130" y="390" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="400">连接和参数全程固定</text><text x="540" y="390" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="400">饥饿等内部状态</text><text x="540" y="426" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="400">学习带来的突触变化</text></svg>