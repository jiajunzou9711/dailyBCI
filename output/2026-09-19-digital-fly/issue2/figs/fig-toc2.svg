<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="1800" height="1250" font-family="-apple-system,'Helvetica Neue','Heiti SC','PingFang SC',sans-serif"><rect width="900" height="625" fill="#FAFAFA"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A1A1A"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6DB5"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A2B2B"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#888888"/></marker></defs><text x="0" y="56" font-size="28" fill="#1A1A1A" text-anchor="start" font-weight="700">本期路线</text><text x="4" y="128" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">①</text><text x="54" y="128" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">数字实验用来做什么</text><text x="54" y="161" font-size="21" fill="#888888" text-anchor="start" font-weight="400">在模型里先筛一遍，前提是预测可信</text><text x="4" y="200" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">②</text><text x="54" y="200" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">模型的三项默认设定</text><text x="54" y="233" font-size="21" fill="#888888" text-anchor="start" font-weight="400">连接、神经元、时间，各自简化了什么</text><text x="4" y="272" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">③</text><text x="54" y="272" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">连接：强度与正负号</text><text x="54" y="305" font-size="21" fill="#888888" text-anchor="start" font-weight="400">一个常数管全脑突触；递质定正负</text><text x="4" y="344" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">④</text><text x="54" y="344" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">神经元：同一条发放规则</text><text x="54" y="377" font-size="21" fill="#888888" text-anchor="start" font-weight="400">统一参数，没有自发放电</text><text x="4" y="416" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">⑤</text><text x="54" y="416" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">时间：状态与经历</text><text x="54" y="449" font-size="21" fill="#888888" text-anchor="start" font-weight="400">饱与饿，模型给同一个预测</text><text x="4" y="488" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">⑥</text><text x="54" y="488" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">怎么补：反推与测量</text><text x="54" y="521" font-size="21" fill="#888888" text-anchor="start" font-weight="400">用任务反推参数；把参数直接测出来</text><text x="4" y="560" font-size="30" fill="#2F6DB5" text-anchor="start" font-weight="700">⑦</text><text x="54" y="560" font-size="27" fill="#1A1A1A" text-anchor="start" font-weight="700">结语</text><text x="54" y="593" font-size="21" fill="#888888" text-anchor="start" font-weight="400">缺的是连接之外的参数</text></svg>