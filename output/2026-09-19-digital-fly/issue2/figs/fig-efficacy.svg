<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="1800" height="1060" font-family="-apple-system,'Helvetica Neue','Heiti SC','PingFang SC',sans-serif"><rect width="900" height="530" fill="#FAFAFA"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A1A1A"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6DB5"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A2B2B"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#888888"/></marker></defs><text x="0" y="34" font-size="25" fill="#1A1A1A" text-anchor="start" font-weight="700">两条连接都是 10 个突触</text><text x="0" y="84" font-size="22" fill="#2F6DB5" text-anchor="start" font-weight="700">模型里</text><circle cx="80" cy="140" r="40" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="80" y="147" font-size="22" fill="#1A1A1A" text-anchor="middle" font-weight="700">A</text><circle cx="80" cy="224" r="40" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="80" y="231" font-size="22" fill="#1A1A1A" text-anchor="middle" font-weight="700">B</text><circle cx="560" cy="182.0" r="48" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="560" y="189.0" font-size="22" fill="#1A1A1A" text-anchor="middle" font-weight="700">C</text><line x1="122" y1="140" x2="510" y2="168.0" stroke="#2F6DB5" stroke-width="4" marker-end="url(#arA)"/><line x1="122" y1="224" x2="510" y2="196.0" stroke="#2F6DB5" stroke-width="4" marker-end="url(#arA)"/><text x="300" y="132" font-size="19" fill="#444444" text-anchor="middle" font-weight="400">10 × 0.275 mV</text><text x="300" y="254" font-size="1