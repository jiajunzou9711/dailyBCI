<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="1800" height="1040" font-family="-apple-system,'Helvetica Neue','Heiti SC','PingFang SC',sans-serif"><rect width="900" height="520" fill="#FAFAFA"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A1A1A"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6DB5"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A2B2B"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#888888"/></marker></defs><text x="0" y="34" font-size="25" fill="#1A1A1A" text-anchor="start" font-weight="700">正负号怎样来到模型里</text><rect x="0" y="64" width="190" height="96" rx="12" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2"/><text x="95" y="106" font-size="21" fill="#1A1A1A" text-anchor="middle" font-weight="700">电镜图像块</text><text x="95" y="138" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">以突触前位点为中心</text><line x1="192" y1="112" x2="228" y2="112" stroke="#1A1A1A" stroke-width="2.4" marker-end="url(#ar)"/><rect x="230" y="64" width="190" height="96" rx="12" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2"/><text x="325" y="106" font-size="21" fill="#1A1A1A" text-anchor="middle" font-weight="700">三维卷积网络</text><text x="325" y="138" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">Eckstein 2024</text><line x1="422" y1="112" x2="458" y2="112" stroke="#1A1A1A" stroke-width="2.4" marker-end="url(#ar)"/><rect x="460" y="64" width="190" height="96" rx="12" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2"/><text x="555" y="106" font-size="21" fill="#1A1A1A" text-anchor="middle" font-weight="700">六种递质之一</text><text x="555" y="138" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">按神经元计票取多数</text><line x1="652" y1="112" x2="688" y2="112" stroke="#1A1A1A" stroke-width="2.4" marker-end="url(#ar)"/><rect x="690" y="64" width="190" height="96" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="785" y="106" font-size="21" fill="#1A1A1A" text-anchor="middle" font-weight="700">正负号</text><text x="785" y="138" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">Shiu 2024 的规则</text><text x="0" y="212" font-size="21" fill="#1A1A1A" text-anchor="start" font-weight="700">规则：GABA、谷氨酸 → 抑制；其余 → 兴奋</text><line x1="0" y1="236" x2="880" y2="236" stroke="#D8D8D8" stroke-width="1.5"/><text x="0" y="280" font-size="22" fill="#1A1A1A" text-anchor="start" font-weight="700">真实情形以谷氨酸为例：方向取决于突触后受体</text><rect x="0" y="306" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="95" y="348" font-size="22" fill="#1A1A1A" text-anchor="middle" font-weight="700">谷氨酸</text><line x1="192" y1="330" x2="330" y2="312" stroke="#8A2B2B" stroke-width="2.4" marker-end="url(#arR)"/><line x1="192" y1="352" x2="330" y2="398" stroke="#2F6DB5" stroke-width="2.4" marker-end="url(#arA)"/><text x="342" y="318" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="700">抑制性受体（如 GluCl）→ 抑制</text><text x="342" y="406" font-size="21" fill="#2F6DB5" text-anchor="start" font-weight="700">兴奋性受体 → 兴奋</text><rect x="0" y="436" width="880" height="64" rx="10" fill="#F7ECEC" stroke="#8A2B2B" stroke-width="1.5"/><text x="20" y="476" font-size="21" fill="#8A2B2B" text-anchor="start" font-weight="700">模型：电镜看不到受体，谷氨酸能神经元的全部输出一律记为抑制</text></svg>